# Local dev services: `npm run services:up`
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: mice
      POSTGRES_PASSWORD: mystics
      POSTGRES_DB: mice_mystics
    ports:
      - '5433:5432' # 5433 so it doesn't clash with other local Postgres instances
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Catches every email the server sends; open http://localhost:8025 to read them
  mail:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web inbox

volumes:
  pgdata:
